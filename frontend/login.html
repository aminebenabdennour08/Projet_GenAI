<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Avatar Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .auth-footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .loading {
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>🎨 Avatar Generator</h2>
        <p class="subtitle">Connectez-vous pour créer vos avatars</p>
        
        <div class="error" id="errorMsg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>👤 Nom d'utilisateur</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>🔒 Mot de passe</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit">Se connecter</button>
        </form>
        
        <div class="loading" id="loading">Connexion en cours...</div>
        
        <div class="auth-footer">
            Pas encore de compte ? <a href="/register.html">S'inscrire</a>
        </div>
    </div>

    <script>
        // Styles CSS directement intégrés pour éviter les requêtes externes
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        
        // Vérifier si déjà connecté
        fetch('/api/check-auth', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/app';
                }
            })
            .catch(err => console.log('Non connecté'));
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            errorMsg.style.display = 'none';
            loading.style.display = 'block';
            loginForm.style.opacity = '0.5';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('username', data.username);
                    window.location.href = '/app';
                } else {
                    errorMsg.textContent = data.error;
                    errorMsg.style.display = 'block';
                    loginForm.style.opacity = '1';
                }
            } catch (error) {
                errorMsg.textContent = 'Erreur de connexion au serveur';
                errorMsg.style.display = 'block';
                loginForm.style.opacity = '1';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
