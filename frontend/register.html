<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Avatar Generator</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>📝 Inscription</h2>
            <p class="subtitle">Créez votre compte</p>
            
            <div class="error" id="errorMsg" style="display:none;"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>👤 Nom d'utilisateur</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>🔒 Mot de passe</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>🔒 Confirmer le mot de passe</label>
                    <input type="password" id="confirm_password" required>
                </div>
                <button type="submit" class="btn-primary">S'inscrire</button>
            </form>
            
            <div class="loading" id="loading" style="display:none;">Inscription en cours...</div>
            
            <div class="auth-footer">
                Déjà un compte ? <a href="/login.html">Se connecter</a>
            </div>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            if (password !== confirm) {
                errorMsg.textContent = 'Les mots de passe ne correspondent pas';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                errorMsg.style.display = 'block';
                return;
            }
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            
            errorMsg.style.display = 'none';
            loading.style.display = 'block';
            registerForm.style.opacity = '0.5';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Inscription réussie ! Veuillez vous connecter.');
                    window.location.href = '/login.html';
                } else {
                    errorMsg.textContent = data.error;
                    errorMsg.style.display = 'block';
                    registerForm.style.opacity = '1';
                }
            } catch (error) {
                errorMsg.textContent = 'Erreur: ' + error.message;
                errorMsg.style.display = 'block';
                registerForm.style.opacity = '1';
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
